spring.application.name=routecraft-api
server.port=${SERVER_PORT:18080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/routecraft}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:routecraft}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:routecraft}

spring.flyway.enabled=true

routecraft.cors.allowed-origins=${ROUTECRAFT_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
routecraft.frontend.base-url=${ROUTECRAFT_FRONTEND_BASE_URL:http://localhost:3000}
routecraft.oauth.state-secret=${ROUTECRAFT_OAUTH_STATE_SECRET:routecraft-dev-oauth-state-secret-change-me}
routecraft.elevation.lookup-timeout-ms=${ROUTECRAFT_ELEVATION_LOOKUP_TIMEOUT_MS:375}

# Rust passed the recorded adoption gates; set java for immediate rollback.
routecraft.routing.engine=${ROUTECRAFT_ROUTING_ENGINE:rust}
routecraft.routing.engine-url=${ROUTECRAFT_ENGINE_URL:http://routecraft-engine:8090}
routecraft.routing.engine-budget-seconds=${ROUTECRAFT_ENGINE_BUDGET_SECONDS:30}

strava.client.id=${STRAVA_CLIENT_ID:}
strava.client.secret=${STRAVA_CLIENT_SECRET:}
strava.oauth.redirect-uri=${STRAVA_OAUTH_REDIRECT_URI:http://localhost:18080/api/auth/strava/callback}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
