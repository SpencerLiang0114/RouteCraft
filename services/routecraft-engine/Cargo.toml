[package]
name = "routecraft-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rstar = "0.12"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
flate2 = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
